name: Update and publish Neutron Bytes

on:
  schedule:
    - cron: '0 7 * * 1'
      timezone: 'America/Chicago'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neutron-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gather, verify and write last week's news
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/update_weekly.py
      - name: Verify local site
        run: python scripts/update_weekly.py --self-check
      - name: Commit only new weekly material
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'neutron-bytes-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html weekly/ data/weeks/
          if ! git diff --cached --quiet; then
            git commit -m 'Add Neutron Bytes briefing for latest completed week'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4