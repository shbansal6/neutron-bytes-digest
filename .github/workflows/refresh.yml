name: Refresh Neutron Bytes news and weekly briefings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  schedule:
    # 07:00 US Central, local-time check handles daylight saving.
    - cron: '0 12 * * 1'
    - cron: '0 13 * * 1'

permissions:
  contents: write

concurrency:
  group: nb-archive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Reconcile Neutron Bytes reports and regenerate source-linked weekly archive
        run: python scripts/refresh.py
      - name: Commit source-linked JSON; connected Vercel Git integration redeploys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/briefings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Neutron Bytes archive and briefings [skip ci]"
            git push
          fi
